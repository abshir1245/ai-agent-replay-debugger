services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agent_replay
      POSTGRES_PASSWORD: agent_replay
      POSTGRES_DB: agent_replay
    ports:
      - "5432:5432"
    volumes:
      - agent-replay-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_replay"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agent-replay-data:

